<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Chat</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0c29" />
</head>
<body>
  <div id="login-overlay">
    <div class="login-card">
      <h2>Pulse Chat</h2>
      <input id="username-input" placeholder="Enter your name" autocomplete="off" maxlength="20" />
      <button id="join-btn">Join Chat</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Online Users</span>
        <span id="user-count">0</span>
      </div>
      <ul id="user-list"></ul>
    </aside>

    <main id="chat-area">
      <header id="chat-header"></header>
      <div id="messages-container">
        <div id="messages"></div>
      </div>
      <div id="input-bar">
        <input type="file" id="image-input" accept="image/*" style="display:none" />
        <button id="image-btn" title="Send image">📎</button>
        <input id="message-input" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    // v2.1 - Cache bust
    "use strict";
    console.log("Socket.IO loaded:", typeof io);

    const socket = io({ transports: ["websocket", "polling"] });
    console.log("Socket created:", socket);

    let myDeviceId = localStorage.getItem("deviceId");
    if (!myDeviceId) {
      myDeviceId = crypto.randomUUID();
      localStorage.setItem("deviceId", myDeviceId);
    }
    console.log("Device ID:", myDeviceId);

    socket.on("connect", () => console.log("SOCKET CONNECTED - id:", socket.id));
    socket.on("connect_error", (err) => console.error("SOCKET CONNECT ERROR:", err.message));
    socket.on("disconnect", (reason) => console.log("SOCKET DISCONNECTED:", reason));

    window.addEventListener('DOMContentLoaded', function() {
      console.log("=== DOM LOADED ===");

      const loginOverlay = document.getElementById("login-overlay");
      const usernameInput = document.getElementById("username-input");
      const joinBtn = document.getElementById("join-btn");
      const app = document.getElementById("app");
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const userList = document.getElementById("user-list");
      const userCountEl = document.getElementById("user-count");
      const imageInput = document.getElementById("image-input");
      const imageBtn = document.getElementById("image-btn");
      const messagesEl = document.getElementById("messages");
      const messagesContainer = document.getElementById("messages-container");

      console.log("Elements found:", { loginOverlay, usernameInput, joinBtn, app });

      if (!loginOverlay || !usernameInput || !joinBtn || !app) {
        console.error("Missing required DOM elements");
        return;
      }

      function joinChat() {
        console.log("=== JOIN CLICKED ===");
        const name = usernameInput.value.trim();
        console.log("Username entered:", name);
        if (!name) {
          alert("Please enter your name");
          return;
        }
        try {
          console.log("Emitting user:join with:", { deviceId: myDeviceId, username: name });
          socket.emit("user:join", { deviceId: myDeviceId, username: name });
          console.log("Socket emit done");
          document.getElementById("header-username").textContent = name;
          console.log("Hiding overlay");
          loginOverlay.style.display = "none";
          console.log("Showing app");
          app.style.display = "flex";
          console.log("App should be visible now");
          messageInput.focus();
        } catch (e) {
          console.error("Join error:", e);
        }
      }

      joinBtn.addEventListener("click", joinChat);
      console.log("Join button click listener attached");

      usernameInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") joinChat();
      });

      function sendMessage() {
        console.log("=== SEND CLICKED ===");
        const text = messageInput.value.trim();
        if (!text) return;
        socket.emit("message:send", { text });
        messageInput.value = "";
      }

      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") sendMessage();
      });

      imageBtn.addEventListener("click", function() {
        imageInput.click();
      });

      imageInput.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          socket.emit("image:send", { imageUrl: ev.target.result });
        };
        reader.readAsDataURL(file);
      });

      socket.on("messages:history", function(messages) {
        console.log("=== RECEIVED MESSAGES HISTORY ===", messages.length);
        messages.forEach(renderMessage);
      });

      socket.on("message:new", function(msg) {
        console.log("=== RECEIVED NEW MESSAGE ===");
        renderMessage(msg);
      });

      socket.on("users:update", function(users) {
        console.log("=== USERS UPDATE ===", users.length);
        if (userCountEl) userCountEl.textContent = users.length;
        if (userList) {
          userList.innerHTML = "";
          users.forEach(function(user) {
            const li = document.createElement("li");
            li.className = user.isOnline ? "online" : "offline";
            li.innerHTML = '<span class="online-dot"></span> <span>' + user.username + '</span>';
            userList.appendChild(li);
          });
        }
      });

      function renderMessage(msg) {
        console.log("Rendering message:", msg._id || msg.id);
        const div = document.createElement("div");
        div.className = "msg " + ((msg.senderDeviceId === myDeviceId) ? "msg-mine" : "msg-other");
        div.dataset.id = msg._id || msg.id;
        const senderName = msg.senderName || msg.username || "Unknown";
        const text = msg.text || "";
        div.innerHTML = '<div class="msg-header">' + senderName + '</div> <div>' + escapeHtml(text) + '</div>';
        messagesEl.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[c]);
      }

      console.log("Chat app initialized");
    });
  </script>
</body>
</html>
