<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111" />
</head>
<body>
  <div id="login-overlay">
    <div class="login-card">
      <h2>Chat App</h2>
      <input id="username-input" placeholder="Enter your name" autocomplete="off" />
      <button id="join-btn">Join Chat</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Users</span>
        <span id="user-count">0</span>
      </div>
      <ul id="user-list"></ul>
    </aside>

    <main id="chat-area">
      <header id="chat-header">
        <span id="header-username"></span>
      </header>
      <div id="messages-container">
        <div id="messages"></div>
      </div>
      <div id="input-bar">
        <input type="file" id="image-input" accept="image/*" style="display:none" />
        <button id="image-btn">📎</button>
        <input id="message-input" placeholder="Type a message" autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
