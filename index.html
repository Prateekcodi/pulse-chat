<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse · Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <!-- Living aurora canvas -->
  <canvas id="aurora"></canvas>
  <!-- Film grain -->
  <div class="grain"></div>

  <!-- ═══════════════ LOGIN ═══════════════ -->
  <div id="login-overlay">
    <div class="login-scene">
      <div class="login-halo"></div>
      <div class="login-card">

        <div class="brand">
          <div class="brand-orb">
            <span class="orb-pulse"></span>
            <span class="orb-core"></span>
          </div>
          <span class="brand-name">pulse</span>
        </div>

        <p class="login-tagline">Conversations, alive.</p>

        <div class="field-wrap">
          <label class="field-label" for="username-input">Your name</label>
          <div class="field-box">
            <input id="username-input" type="text"
              placeholder="e.g. Alex…"
              maxlength="24" autocomplete="off" spellcheck="false" />
            <div class="field-underline"></div>
          </div>
        </div>

        <button id="join-btn" class="join-btn">
          <span>Enter the room</span>
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="btn-shimmer"></span>
        </button>

        <p class="login-hint">Press <kbd>Enter</kbd> to join</p>
      </div>
    </div>
  </div>

<!-- ═══════════════ APP ═══════════════ -->
   <div id="app" class="hidden">

     <!-- Mobile Menu Button -->
     <button id="menu-btn" class="menu-btn" title="Toggle user list">
       <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <line x1="3" y1="12" x2="21" y2="12"></line>
         <line x1="3" y1="6" x2="21" y2="6"></line>
         <line x1="3" y1="18" x2="21" y2="18"></line>
       </svg>
     </button>

     <!-- Mobile Overlay -->
     <div id="sidebar-overlay"></div>

     <!-- Sidebar -->
     <aside id="sidebar">
      <div class="sb-top">
        <div class="brand-sm">
          <span class="orb-sm-dot"></span>
          <span class="brand-sm-name">pulse</span>
        </div>
      </div>

      <div class="sb-section-label">
        <span>Online</span>
        <span id="user-count" class="count-pill">0</span>
      </div>

      <ul id="user-list"></ul>

      <div class="sb-footer">
        <div id="my-profile" class="my-profile">
          <div id="my-avatar" class="my-avatar"></div>
          <span id="my-name" class="my-name-text"></span>
          <span class="you-tag">you</span>
        </div>
      </div>
    </aside>

    <!-- Chat -->
    <main id="chat-area">
      <!-- Scroll controller -->
      <button id="scroll-ctrl" title="Drag to scroll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="7 11 12 6 17 11"/>
          <polyline points="7 13 12 18 17 13"/>
        </svg>
      </button>

      <header id="chat-header">
        <div class="ch-left">
          <span class="ch-hash">#</span>
          <span class="ch-channel">general</span>
          <span class="ch-sep">·</span>
          <span class="ch-sub">Open to everyone</span>
        </div>
        <div class="ch-right">
          <span class="live-dot"></span>
          <span class="live-label">live</span>
          <button id="logout-btn" class="icon-btn" title="Logout" aria-label="Logout" onclick="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
</button>
        </div>
      </header>

      <div id="messages-container">
        <div id="messages-inner">
          <div class="chat-welcome">
            <div class="welcome-icon">⚡</div>
            <p class="welcome-text">Beginning of <strong>#general</strong></p>
          </div>
          <div id="messages"></div>
        </div>
      </div>

      <!-- Reply Preview -->
      <div id="reply-preview" class="hidden">
        <div class="reply-content">
          <div class="reply-info">
            <span class="reply-label">Replying to</span>
            <span id="reply-username" class="reply-username"></span>
          </div>
          <span id="reply-text" class="reply-text"></span>
          <button id="cancel-reply" class="cancel-reply" title="Cancel reply">✕</button>
        </div>
      </div>

      <div id="input-bar">
        <input type="file" id="image-input" accept="image/*" style="display:none" />

<button id="image-btn" class="icon-btn" title="Attach image" aria-label="Attach image">
           <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <rect x="3" y="3" width="18" height="18" rx="3"/>
             <circle cx="8.5" cy="8.5" r="1.5"/>
             <polyline points="21 15 16 10 5 21"/>
           </svg>
         </button>

         <button id="gif-btn" class="icon-btn" title="Send adult GIF" aria-label="Send adult GIF">
           <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <rect x="2" y="2" width="20" height="20" rx="3"/>
             <circle cx="8" cy="8" r="1.5"/>
             <path d="M2 12h20"/>
             <path d="M12 2v20"/>
             <circle cx="16" cy="16" r="2"/>
           </svg>
         </button>

        <div class="msg-input-wrap">
          <input id="message-input" type="text"
            placeholder="Message #general…"
            maxlength="500" autocomplete="off" spellcheck="false" />
          <span class="input-focus-ring"></span>
        </div>

        <button id="send-btn" class="send-btn" aria-label="Send message">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

    </main>
  </div>

<script src="/socket.io/socket.io.js"></script>
   <script src="client.js?v=3"></script>
 </body>
</html>
